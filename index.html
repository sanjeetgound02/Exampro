<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Online Examination System</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Background Animation -->
    <div class="background">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <!-- Main Container -->
    <div class="container">

        <div class="login-card">

            <!-- Logo -->
            <div class="logo">
                <div class="logo-icon">
                    📝
                </div>

                <h1>Exam<span>Pro</span></h1>

                <p>Online Examination System</p>
            </div>

            <!-- Login Form -->
            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword">
                            👁
                        </button>

                    </div>

                </div>

                <div class="options">

                    <label>
                        <input type="checkbox" id="remember">
                        Remember me
                    </label>

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>

                <button
                    type="submit"
                    class="login-btn"
                    id="loginBtn">

                    Login

                </button>

                <p id="message"></p>

            </form>

            <!-- Demo Login -->
            <div class="demo-login">

                <h3>Demo Login</h3>

                <p>
                    Email:
                    <strong>admin@exam.com</strong>
                </p>

                <p>
                    Password:
                    <strong>admin123</strong>
                </p>

            </div>

        </div>

    </div>

    <!-- JavaScript -->
    <script src="css/js/auth.js"></script>

</body>

</html>
