<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Online Exam - ExamPro</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Exam CSS -->
    <link rel="stylesheet" href="css/exam.css">
</head>

<body>

    <!-- ==============================
         HEADER
    =============================== -->

    <header class="exam-header">

        <div class="brand">
            <div class="brand-icon">✓</div>

            <div>
                <h2>ExamPro</h2>
                <span>Online Examination</span>
            </div>
        </div>

        <div class="exam-info">
            <div>
                <small>EXAMINATION</small>
                <strong id="examTitle">Computer Fundamentals</strong>
            </div>

            <div class="timer-box">
                <span>Time Remaining</span>
                <strong id="timer">30:00</strong>
            </div> 
        </div>

    </header>


    <!-- ==============================
         MAIN EXAM AREA
    =============================== -->

    <main class="exam-container">

        <!-- Progress -->

        <div class="progress-section">

            <div class="progress-text">
                <span id="questionNumber">Question 1 of 20</span>
                <span id="progressPercent">5%</span>
            </div>

            <div class="progress-bar">
                <div id="progressFill"></div>
            </div>

        </div>


        <!-- Question Card -->

        <section class="question-card">

            <div class="question-top">

                <span class="question-label">
                    Question <span id="currentQuestion">1</span>
                </span>

                <button class="mark-btn" id="markBtn">
                    ☆ Mark for Review
                </button>

            </div>


            <h2 id="questionText">
                What is a computer?
            </h2>


            <!-- Options -->

            <div id="optionsContainer" class="options-container">

                <!-- Options will be generated by JavaScript -->

            </div>


            <!-- Navigation -->

            <div class="navigation">

                <button id="previousBtn" class="nav-btn previous">
                    ← Previous
                </button>

                <button id="nextBtn" class="nav-btn next">
                    Next →
                </button>

            </div>

        </section>


        <!-- Question Navigator -->

        <aside class="question-panel">

            <h3>Question Navigator</h3>

            <p>
                Click a number to jump to a question.
            </p>

            <div id="questionNumbers" class="question-numbers">
                <!-- Generated by JavaScript -->
            </div>

            <div class="legend">

                <div>
                    <span class="legend-box answered"></span>
                    Answered
                </div>

                <div>
                    <span class="legend-box current"></span>
                    Current
                </div>

                <div>
                    <span class="legend-box unanswered"></span>
                    Unanswered
                </div>

            </div>

        </aside>

    </main>


    <!-- ==============================
         SUBMIT SECTION
    =============================== -->

    <div class="submit-section">

        <button id="submitBtn" class="submit-btn">
            Submit Exam
        </button>

    </div>


    <!-- ============================== 
         JAVASCRIPT
    =============================== -->

    <script src="css/js/exam.js"></script>

</body>
</html>
